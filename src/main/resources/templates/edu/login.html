<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>로그인 | EduAI Campus</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">


    <!-- Pretendard -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">


    <style>

        * {
            font-family: Pretendard, sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(81,70,229,.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(0,188,212,.2),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #171a3a,
                    #29235f
                );

            display: flex;

            align-items: center;

            justify-content: center;

        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {

            width: 430px;

            max-width: 92%;

            background: rgba(
                255,
                255,
                255,
                .97
            );

            border-radius: 25px;

            padding: 45px;

            box-shadow:
                0 30px 80px rgba(
                    0,
                    0,
                    0,
                    .25
                );

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            color: #5146e5;

            font-size: 27px;

            font-weight: 800;

            margin-bottom: 8px;

        }


        .login-subtitle {

            text-align: center;

            color: #8991a4;

            margin-bottom: 35px;

        }


        /* =========================
           INPUT
        ========================= */

        .input-group-custom {

            position: relative;

            margin-bottom: 18px;

        }


        .input-group-custom i {

            position: absolute;

            left: 16px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #9299aa;

            z-index: 5;

        }


        .form-control {

            height: 55px;

            border-radius: 12px;

            border: 1px solid #e0e2e8;

            padding-left: 48px;

        }


        .form-control:focus {

            border-color: #5146e5;

            box-shadow:
                0 0 0 3px
                rgba(
                    81,
                    70,
                    229,
                    .1
                );

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            height: 55px;

            border: none;

            border-radius: 12px;

            background: #5146e5;

            color: white;

            font-size: 16px;

            font-weight: 700;

            margin-top: 10px;

        }


        .login-btn:hover {

            background: #4036c8;

        }


        /* =========================
           OPTIONS
        ========================= */

        .login-options {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-top: 15px;

            font-size: 14px;

        }


        .login-options a {

            color: #70788a;

            text-decoration: none;

        }


        .login-options a:hover {

            color: #5146e5;

        }


        /* =========================
           DIVIDER
        ========================= */

        .divider {

            display: flex;

            align-items: center;

            gap: 15px;

            margin: 30px 0;

            color: #aaa;

            font-size: 13px;

        }


        .divider::before,
        .divider::after {

            content: "";

            height: 1px;

            background: #e5e5e5;

            flex: 1;

        }


        /* =========================
           JOIN
        ========================= */

        .join-box {

            text-align: center;

            padding: 18px;

            border-radius: 12px;

            background: #f6f6ff;

        }


        .join-box span {

            color: #777;

            font-size: 14px;

        }


        .join-box a {

            color: #5146e5;

            font-weight: 700;

            text-decoration: none;

            margin-left: 5px;

        }


        /* =========================
           HOME
        ========================= */

        .home-link {

            display: block;

            text-align: center;

            color: #aaa;

            text-decoration: none;

            margin-top: 25px;

            font-size: 14px;

        }


        .home-link:hover {

            color: white;

        }

    </style>

</head>


<body>


<div class="login-card">


    <!-- LOGO -->

    <div class="logo">

        <i class="bi bi-mortarboard-fill"></i>

        EduAI Campus

    </div>


    <p class="login-subtitle">

        AI 시대를 준비하는 실무 교육 플랫폼

    </p>



    <!-- LOGIN FORM -->

    <form>


        <!-- ID -->

        <div class="input-group-custom">

            <i class="bi bi-person"></i>

            <input
                type="text"
                class="form-control"
                placeholder="아이디">

        </div>


        <!-- PASSWORD -->

        <div class="input-group-custom">

            <i class="bi bi-lock"></i>

            <input
                type="password"
                class="form-control"
                placeholder="비밀번호">

        </div>



        <!-- OPTIONS -->

        <div class="login-options">


            <div>

                <input
                    type="checkbox"
                    id="remember">

                <label for="remember">
                    로그인 유지
                </label>

            </div>


            <div>

                <a href="#">
                    아이디 찾기
                </a>

                <span class="text-secondary">
                    |
                </span>

                <a href="#">
                    비밀번호 찾기
                </a>

            </div>


        </div>



        <!-- BUTTON -->

        <button
            type="submit"
            class="login-btn">

            로그인

        </button>


    </form>



    <!-- DIVIDER -->

    <div class="divider">

        또는

    </div>



    <!-- JOIN -->

    <div class="join-box">

        <span>
            아직 회원이 아니신가요?
        </span>

        <a href="#">
            회원가입
        </a>

    </div>



    <!-- HOME -->

    <a href="index.html"
       class="home-link">

        <i class="bi bi-arrow-left"></i>

        EduAI Campus 홈으로

    </a>


</div>


</body>

</html>
